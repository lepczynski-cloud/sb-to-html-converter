name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate release tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json (${EXPECTED_TAG})." >&2
            exit 1
          fi

      - name: Install repository tools
        run: npm install --no-audit --no-fund

      - name: Verify and build
        run: |
          npm run verify
          npm run build
          npm run verify:dist

      - name: Prepare release files
        shell: bash
        run: |
          cp dist/offline/sb-to-html-converter.html "sb-to-html-converter-${GITHUB_REF_NAME}-offline.html"
          (
            cd dist
            zip -q -r "../sb-to-html-converter-${GITHUB_REF_NAME}-site.zip" .
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "sb-to-html-converter-${GITHUB_REF_NAME}-offline.html" \
            "sb-to-html-converter-${GITHUB_REF_NAME}-site.zip" \
            --title "SB to HTML Converter ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
